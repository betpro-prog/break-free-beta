  function saveUrge(form){

  const THEME_LABELS={"hr":["Izgled aplikacije","Šumska","Oceanska","Topla","Jednostavna","Promjena izgleda je besplatna tijekom beta-testiranja."],"en":["App appearance","Forest","Ocean","Warm","Minimal","Appearance options are free during beta."],"de":["Darstellung","Wald","Ozean","Warm","Minimal","Designoptionen sind in der Beta kostenlos."],"es":["Apariencia","Bosque","Océano","Cálido","Minimal","Los temas son gratis durante la beta."],"it":["Aspetto","Foresta","Oceano","Caldo","Minimal","I temi sono gratuiti durante la beta."],"fr":["Apparence","Forêt","Océan","Chaud","Minimal","Thèmes gratuits pendant la bêta."],"pt":["Aparência","Floresta","Oceano","Quente","Minimal","Temas gratuitos durante a beta."],"pl":["Wygląd","Las","Ocean","Ciepły","Minimal","Motywy są bezpłatne podczas bety."]};

  function vibrate(){try{navigator.vibrate?.(12);}catch(_err){}}

  function tickBreathing(){if(breathStarted===null)return;breathLeft=Math.max(0,60-Math.floor((Date.now()-breathStarted)/1000));
    const counter=document.getElementById('breath-count'),fill=document.getElementById('breath-fill'),phase=document.getElementById('breath-phase');
    if(counter)counter.textContent=breathLeft+'s';if(fill)fill.style.width=((60-breathLeft)/60*100)+'%';
    if(phase){const n=(60-breathLeft)%14;phase.textContent=n<4?t('breatheIn'):n<8?t('breatheHold'):t('breatheOut');}
    if(breathLeft===0){stopBreathing();checkSource='breath';render();showDialog('check');}}
  function toggleBreathe(){if(breathStarted!==null){stopBreathing();render();toast(t('breathePaused'));return;}breathLeft=60;breathStarted=Date.now();breathTimer=setInterval(tickBreathing,200);render();tickBreathing();}
  function changeCount(step){const now=today();const current=day();if(current===null&&step<0)return;data.days[now]={cigs:Math.max(0,Math.min(150,(current??0)+step))};persist();render();}
  function saveGoal(){const baseline=document.getElementById('baseline')?.value?.trim()??'';const price=document.getElementById('pack-price')?.value?.trim()??'';
    const validBaseline=baseline==='' || (/^\d+$/.test(baseline)&&Number(baseline)<=100);
    const validPrice=price==='' || (Number.isFinite(Number(price))&&Number(price)>=0&&Number(price)<=100&&/^\d+(\.\d{1,2})?$/.test(price));
    if(!validBaseline||!validPrice){toast(t('invalidGoal'));return;}data.baseline=baseline===''?null:Number(baseline);data.packPrice=price===''?null:Number(price);persist();render();toast(t('goalSaved'));}
  function exportCsv(){
    if(!window.BF_Analytics)return;
    const csv=window.BF_Analytics.toCsv(data.days,90);
    if(window.BreakFreeAndroid&&typeof window.BreakFreeAndroid.saveCsv==='function'){
      window.BreakFreeAndroid.saveCsv(csv);return;
    }
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='break-free-90-days.csv';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
  }
  function exportData(){const contents=JSON.stringify({app:'Break Free',...data,exportedAt:new Date().toISOString()},null,2);
    const blob=new Blob([contents],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`break-free-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
  async function importData(file){
    if(!file)return;
    if(file.size>1024*1024){toast(t('importFailed'));return;}
    let parsed;
    try {parsed=JSON.parse(await file.text());}catch(_err){toast(t('importFailed'));return;}
    if(parsed?.app!=='Break Free'||parsed.version!==2||!parsed.days||typeof parsed.days!=='object'||Array.isArray(parsed.days)||!Array.isArray(parsed.checkins)){
      toast(t('importFailed'));return;
    }
    const days={};
    for(const [key,value] of Object.entries(parsed.days).slice(-1000)){
      if(/^\d{4}-\d{2}-\d{2}$/.test(key)&&isNum(value?.cigs)&&value.cigs>=0&&value.cigs<=150){days[key]={cigs:Math.round(value.cigs)};}
    }
    const checkins=parsed.checkins.slice(-500).filter(e=>e && /^\d{4}-\d{2}-\d{2}$/.test(e.day)&&['smoke','breath'].includes(e.kind)&&['weaker','same','stronger','skipped'].includes(e.feeling))
      .map(e=>({day:e.day,kind:e.kind,feeling:e.feeling}));
    const baseline=isNum(parsed.baseline)&&parsed.baseline>=0&&parsed.baseline<=100?parsed.baseline:null;
    const packPrice=isNum(parsed.packPrice)&&parsed.packPrice>=0&&parsed.packPrice<=100?parsed.packPrice:null;
    if(!window.confirm(t('importConfirm')))return;
    stopBreathing();
    data={...DEFAULT(),adult:true,minor:false,language:LANGS.some(l=>l[0]===parsed.language)?parsed.language:data.language,
      showSmoke:!!parsed.showSmoke,theme:validTheme(parsed.theme),urges:window.BF_Urges?window.BF_Urges.sanitize(parsed.urges,365):[],days,checkins,baseline,packPrice,view:'home'};
    persist();render();toast(t('importSuccess'));
  }
  function handle(action,el){switch(action){
    case 'go':navigate(el.dataset.page);break;
    case 'smoke-tap':smokeTap();break;
    case 'smoke-reset':data.smokePuffs=0;persist();render();break;
    case 'breathe-toggle':toggleBreathe();break;
    case 'check':checkIn(el.dataset.feeling);break;
    case 'log':changeCount(Number(el.dataset.step));break;
    case 'log-zero':data.days[today()]={cigs:0};persist();render();toast(t('confirmZero'));break;
    case 'log-clear':delete data.days[today()];persist();render();toast(t('clearedEntry'));break;
    case 'export':exportData();break;
    case 'export-csv':exportCsv();break;
    case 'urge-delete':if(Array.isArray(data.urges)&&data.urges.length){data.urges.pop();persist();render();toast(window.BF_Urges.languageLabels(data.language)[17]);}break;
    case 'adult-yes':data.adult=true;data.minor=false;persist();closeDialog();render();break;
    case 'adult-no':data.minor=true;data.adult=false;persist();showDialog('minor');break;
    case 'reset-ask':showDialog('reset');break;
    case 'reset-confirm':{const lang=data.language;data={...DEFAULT(),language:lang,adult:true};persist();closeDialog();render();toast(t('successSaved'));break;}
    case 'dialog-close':closeDialog();break;
  }}
  document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el||el.disabled)return;
    if(!data.adult&&!['adult-yes','adult-no'].includes(el.dataset.action))return;
    if(dialog && !el.closest('#dialog-root'))return;
    handle(el.dataset.action,el);});
  document.addEventListener('keydown',ev=>{const el=ev.target.closest('.is-link[data-action]');if(el&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();handle(el.dataset.action,el);}});
  document.addEventListener('change',ev=>{if(ev.target===langSelect){data.language=ev.target.value;persist();render();}
    if(ev.target.id==='bf-theme'){data.theme=validTheme(ev.target.value);persist();render();}
    if(ev.target.id==='smoke-toggle'){data.showSmoke=ev.target.checked;persist();render();}
    if(ev.target.id==='backup-file'){const file=ev.target.files?.[0];importData(file);}});
  document.addEventListener('submit',ev=>{if(ev.target.id==='goals-form'){ev.preventDefault();saveGoal();}if(ev.target.id==='urge-form'){ev.preventDefault();saveUrge(ev.target);}});
  window.addEventListener('storage',event=>{if(event.key===KEY){try{const incoming=JSON.parse(event.newValue);if(incoming?.version===2){data={...DEFAULT(),...incoming};render();}}catch(_err){}}});
  load();render();if(!data.adult)showDialog(data.minor?'minor':'adult');
  if(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname)){
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();

</script>
